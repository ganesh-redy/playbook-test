---
- name: Complete Environment Variables Example
  hosts: localhost
  connection: local
  
  vars:
    # Custom variables
    app_name: "{{ name }}"
    version: "{{ ver }}"
  environment:
    # Set for this play
    APP_NAME: "{{ app }}"
    CURRENT_USER: "{{ user }}"

  tasks:
    - name: Print all variables
      debug:
        msg: |
          Version: {{ version }}
          App: {{ app_name }}
    - name: Check environment variables are set
      shell: echo "APP_NAME=$APP_NAME, CURRENT_USER=$CURRENT_USER"
      register: env_output
    
    - name: Show environment output
      debug:
        var: env_output.stdout
