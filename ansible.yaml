---
- name: Complete Environment Variables Example
  hosts: all
  become: true
  
  vars:
    # Custom variables
    #app_name: "{{ name }}"
    version: "{{ ver }}"
  environment:
    # Set for this play
    APP_NAME: "{{ app }}"
    CURRENT_USER: "{{ user }}"

  tasks:
    - name: Print all variables
      debug:
        msg: |
          Version: {{ version }}
          App: {{ app }}
    - name: Check environment variables are set
      shell: echo "APP_NAME=$APP_NAME CURRENT=$CURRENT_USER"
      register: env_output
    
    - name: Show environment output
      debug:
        var: env_output.stdout
    - name: Create directory using environment variables
      shell: |
        mkdir -p "/tmp/${APP_NAME}/${CURRENT_USER}"
      args:
        executable: /bin/bash
    
    - name: Check created directories
      shell: |
        echo "Contents of /tmp:"
        ls -la /tmp/
        echo -e "\nContents of /tmp/${APP_NAME}:"
        ls -la "/tmp/${APP_NAME}/" 2>/dev/null || echo "Directory not found"
      register: dir_check
      args:
        executable: /bin/bash
    
    - name: Show directory check results
      debug:
        var: dir_check.stdout_lines
